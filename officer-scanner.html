<!DOCTYPE html>
<html class="light" lang="en">
<head>

    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {

                    colors: {

                        "outline": "#77767e",
                        "secondary-fixed": "#d9e2ff",
                        "on-primary-fixed": "#151a31",
                        "on-tertiary-container": "#7073ff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#07006c",
                        "error-container": "#ffdad6",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#e1e0ff",
                        "on-tertiary-fixed": "#07006c",
                        "secondary": "#0057c2",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#004398",
                        "eco-success": "#16865B",
                        "tertiary-fixed-dim": "#c0c1ff",
                        "on-primary-fixed-variant": "#41455e",
                        "on-surface-variant": "#46464d",
                        "on-surface": "#181c1f",
                        "warning-amber": "#F59E0B",
                        "surface-container-low": "#f1f4f8",
                        "primary": "#000000",
                        "on-background": "#181c1f",
                        "on-primary-container": "#7e829e",
                        "danger-red": "#EF4444",
                        "primary-fixed": "#dde1ff",
                        "inverse-on-surface": "#eef1f5",
                        "surface-variant": "#e0e3e7",
                        "surface": "#f7fafe",
                        "on-primary": "#ffffff",
                        "tertiary": "#000000",
                        "primary-fixed-dim": "#c1c5e3",
                        "surface-bright": "#f7fafe",
                        "violet-accent": "#8B5CF6",
                        "inverse-primary": "#c1c5e3",
                        "on-error-container": "#93000a",
                        "secondary-fixed-dim": "#afc6ff",
                        "inverse-surface": "#2d3134",
                        "on-tertiary-fixed-variant": "#2f2ebe",
                        "outline-variant": "#c7c5ce",
                        "primary-container": "#151a31",
                        "on-secondary-container": "#fefcff",
                        "dark-navy-text": "#111827",
                        "surface-tint": "#585d77",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e0e3e7",
                        "surface-container": "#ebeef2",

                        "on-tertiary": "#ffffff",

                    borderRadius: {

                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    spacing: {
                        "xl": "40px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "margin-desktop": "32px",
                        "unit": "4px",
                        "gutter": "16px",
                        "lg": "24px",
                        "margin-mobile": "16px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    fontFamily: {
                        "label-xs": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "label-xs": ["12px", { lineHeight: "16px", fontWeight: "700" }],
                        "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
                        "label-sm": ["14px", { lineHeight: "20px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "headline-xl": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .scan-line {
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .success-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col font-sans antialiased relative">
    <!-- Active Camera Viewfinder Background -->
    <div class="absolute inset-0 z-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDGu0ObCJWft4PpmGRHyqQaS1wc0An5soWABF1BiIEnysOHCOTykZ2yIn4J-QjSaqpia08BvMEHtoIm9rvwhyrQQG3sLI8nhGbVWDRiIX2j21TDiiGENlwZUOKJg2jS8ovefOt0_u27IYDsmjYFviaGJrZWTtlbSpdm3rBVdjkrr7wceWZpUJHVIL9zLzw5A8SQfSOEW2-wDO4Ft2-PUZatfnGlWQiqkelpc3605IN7EoWFqQGrnGe5')"></div>
    <div class="absolute inset-0 z-0 bg-gradient-to-b from-primary-container/80 via-transparent to-primary-container/90 mix-blend-multiply"></div>
    
    <!-- TopAppBar -->
    <header class="docked full-width top-0 bg-surface/80 backdrop-blur-md shadow-sm z-20 sticky">
        <div class="flex justify-between items-center w-full px-margin-mobile py-4">
            <div class="flex items-center gap-sm">
                <span class="material-symbols-outlined text-primary dark:text-inverse-primary" data-icon="eco">eco</span>
                <h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">School Ecosystem - Pemindai Petugas</h1>
            </div>
            <!-- Log out button -->
            <div class="flex items-center gap-sm">
                <button onclick="logout()" class="text-danger-red font-label-sm border border-danger-red/30 px-3 py-1 rounded-full bg-white/80 hover:bg-danger-red/10 transition-colors">
                    Keluar
                </button>
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-surface-container-high">
                    <img id="officer-avatar" alt="Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeYFI6Z8p3RGBBsw9yKkCkx9qUHxKnXKY5xZ7AmYHen0fCOqC6xTXEpdaIs2N-qoNdrJQ3ZbuyFX6UMb0akhIk6QJwRxaETYROUxUAVMYsHXzkli7VO7E51g-FtIK2sMPrTK-ncV-xLA_FHDJY4ZdccyFQdAvSSFzCH_KdY0zWIceoIQMza-nopzrz6Z2ICcKhBSTaZm8G8SdwktNIrUAxl-qoJjNm56Jx0iRAUe92yPzCM_l6rRD_"/>
                </div>
            </div>
        </div>
    </header>

    <!-- Scanner Reticle -->
    <div class="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
        <div class="relative w-64 h-64">
            <div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-secondary rounded-tl-lg"></div>
            <div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-secondary rounded-tr-lg"></div>
            <div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-secondary rounded-bl-lg"></div>
            <div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-secondary rounded-br-lg"></div>
            <div class="scan-line absolute left-4 right-4 h-0.5 bg-secondary shadow-[0_0_8px_rgba(0,87,194,0.8)]"></div>
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-secondary/50"></div>
        </div>
    </div>

    <!-- Top Status Indicator & Scanner selector to change student -->
    <div class="absolute top-24 left-0 right-0 flex flex-col items-center gap-sm z-10">
        <div class="bg-surface-container-lowest/90 backdrop-blur-md px-4 py-2 rounded-full shadow-lg flex items-center gap-2 border border-outline-variant/30">
            <span class="relative flex h-3 w-3">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-eco-success opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-eco-success"></span>
            </span>
            <span class="font-label-sm text-label-sm text-on-surface">Sistem Aktif</span>
        </div>
        <!-- Select student drop down to mock QR scanning different students -->
        <div class="bg-surface-container-lowest/90 backdrop-blur-md px-3 py-1.5 rounded-full shadow-md border border-outline-variant/30 flex items-center gap-2 mt-1">
            <label class="font-label-xs text-label-xs text-muted-gray">Simulasikan Scan QR:</label>
            <select id="studentSelect" onchange="changeScannedStudent()" class="bg-transparent border-none py-0 pl-1 pr-6 font-label-xs text-label-xs text-primary focus:ring-0">
                <!-- Loaded dynamically -->
            </select>
        </div>
    </div>

    <!-- Verification UI Bottom Sheet -->
    <div class="fixed bottom-0 left-0 right-0 z-20 bg-surface-container-lowest/95 backdrop-blur-xl rounded-t-[32px] border-t border-outline-variant/20 shadow-[0_-8px_32px_rgba(11,16,38,0.15)] transition-transform duration-300 transform translate-y-0 pb-safe max-h-[65vh] overflow-y-auto">
        <div class="w-full flex justify-center pt-4 pb-2">
            <div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
        </div>
        <div class="px-margin-mobile pb-8 pt-2 space-y-4 max-w-md mx-auto">
            <!-- Student Context -->
            <div class="flex items-center gap-4 bg-surface-container-low p-3 rounded-2xl border border-surface-container-highest">
                <div class="w-12 h-12 rounded-full overflow-hidden bg-primary-fixed shrink-0">
                    <img id="scanned-avatar" alt="Student" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhywktoKb0tTEanJaUJz-rfoDVmCtcxfHYQNaR60zwTq-sLDlF47ZYg822Ifnc0OMFMW3wLbqIr9EtBdVF9855HY6KDkHGwyX8I252Df2Zr7gMGlpGNwx1p4K21uUDrQHNXamYPXffO0F0xFcOiRJnfMsiwlPyerh2RiKFdQzvHRrvdemS_NOnYbjbdLIIOd4zf1DC5ArWUZI2u_wlKE-ykFz-RgQtcL8ZFQHerWx08na63RdLRQ2a"/>
                </div>
                <div class="flex-1">
                    <h2 id="scanned-name" class="font-headline-md text-[20px] font-bold text-on-surface leading-tight">Alex Rivera</h2>
                    <p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">badge</span> ID: <span id="scanned-id">902144</span>
                    </p>
                </div>
                <div id="scanned-grade" class="bg-primary-container text-on-primary-container px-3 py-1 rounded-full font-label-xs text-label-xs">
                    Grade 11
                </div>
            </div>
            <!-- Rapid Verification Toggles -->
            <div class="space-y-3">
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider pl-1">Verifikasi Barang</p>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Toggle Button 1 -->
                    <button type="button" aria-pressed="false" id="toggle-tumbler" class="item-toggle group relative flex flex-col items-center justify-center p-4 rounded-xl border-2 border-surface-container-highest bg-surface hover:bg-surface-container-low transition-all duration-200" onclick="toggleItem(this, 'Tumbler')">
                        <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center indicator transition-colors">
                            <span class="material-symbols-outlined text-[14px] opacity-0 text-on-secondary check-icon">check</span>
                        </div>
                        <span class="material-symbols-outlined text-3xl text-primary mb-2 group-aria-[pressed=true]:text-secondary transition-colors" data-icon="water_drop">water_drop</span>
                        <span class="font-label-sm text-label-sm text-on-surface">Botol Minum</span>
                    </button>
                    <!-- Toggle Button 2 -->
                    <button type="button" aria-pressed="false" id="toggle-lunchbox" class="item-toggle group relative flex flex-col items-center justify-center p-4 rounded-xl border-2 border-surface-container-highest bg-surface hover:bg-surface-container-low transition-all duration-200" onclick="toggleItem(this, 'Lunchbox')">
                        <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-outline-variant flex items-center justify-center indicator transition-colors">
                            <span class="material-symbols-outlined text-[14px] opacity-0 text-on-secondary check-icon">check</span>
                        </div>
                        <span class="material-symbols-outlined text-3xl text-primary mb-2 group-aria-[pressed=true]:text-secondary transition-colors" data-icon="lunch_dining">lunch_dining</span>
                        <span class="font-label-sm text-label-sm text-on-surface">Kotak Makan</span>
                    </button>
                </div>
            </div>
            <!-- Action Button -->
            <button class="w-full bg-secondary hover:bg-secondary-container text-on-secondary font-headline-md text-[18px] font-bold py-4 rounded-full shadow-lg shadow-secondary/20 transition-all active:scale-95 flex items-center justify-center gap-2 mt-4" onclick="triggerSuccess()">
                <span class="material-symbols-outlined">how_to_reg</span>
                Simpan &amp; Lanjutkan
            </button>
        </div>
    </div>

    <!-- Success Overlay -->
    <div class="success-overlay absolute inset-0 z-50 flex items-center justify-center bg-background/90 backdrop-blur-md" id="successOverlay">
        <div class="flex flex-col items-center transform scale-90 transition-transform duration-300" id="successContent">
            <div class="w-24 h-24 bg-eco-success rounded-full flex items-center justify-center shadow-lg shadow-eco-success/30 mb-6">
                <span class="material-symbols-outlined text-5xl text-on-primary filled-icon" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            </div>
            <h2 class="font-headline-xl text-headline-xl text-on-surface mb-2">Terverifikasi</h2>
            <p class="font-body-lg text-body-lg text-on-surface-variant" id="success-message">Poin tercatat untuk Alex Rivera</p>
            <div class="mt-8 font-label-sm text-label-sm text-muted-gray flex items-center gap-2 animate-pulse">
                <span class="material-symbols-outlined text-[16px]">qr_code_scanner</span>
                Siap untuk siswa berikutnya...
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script>
        checkAuth(['officer']);

        const selectedItems = [];

        function toggleItem(btn, itemName) {
            const isPressed = btn.getAttribute('aria-pressed') === 'true';
            btn.setAttribute('aria-pressed', !isPressed);
            
            const indicator = btn.querySelector('.indicator');
            const check = btn.querySelector('.check-icon');
            
            if (!isPressed) {
                // Activate
                btn.classList.add('border-secondary', 'bg-secondary-fixed/30');
                btn.classList.remove('border-surface-container-highest');
                indicator.classList.add('bg-secondary', 'border-secondary');
                indicator.classList.remove('border-outline-variant');
                check.classList.remove('opacity-0');
                selectedItems.push(itemName);
            } else {
                // Deactivate
                btn.classList.remove('border-secondary', 'bg-secondary-fixed/30');
                btn.classList.add('border-surface-container-highest');
                indicator.classList.remove('bg-secondary', 'border-secondary');
                indicator.classList.add('border-outline-variant');
                check.classList.add('opacity-0');
                const index = selectedItems.indexOf(itemName);
                if (index > -1) selectedItems.splice(index, 1);
            }
        }

        let activeStudent = null;

        function changeScannedStudent() {
            const state = getAppState();
            const studentId = document.getElementById("studentSelect").value;
            activeStudent = state.students.find(s => s.id === studentId);

            document.getElementById("scanned-name").innerText = activeStudent.name;
            document.getElementById("scanned-id").innerText = activeStudent.id;
            document.getElementById("scanned-avatar").src = activeStudent.avatar;
            document.getElementById("scanned-grade").innerText = activeStudent.grade;
        }

        function triggerSuccess() {
            if (selectedItems.length === 0) {
                alert("Silakan pilih minimal satu barang (Botol Minum atau Kotak Makan)!");
                return;
            }

            const state = getAppState();

            // Calculate points: Tumbler = 50, Lunchbox = 100
            let pointsEarned = 0;
            if (selectedItems.includes("Tumbler")) pointsEarned += 50;
            if (selectedItems.includes("Lunchbox")) pointsEarned += 100;

            // Log new validation request in localStorage
            const valId = "val-" + Date.now();
            const newValidation = {
                id: valId,
                studentId: activeStudent.id,
                studentName: activeStudent.name,
                pointsEarned: pointsEarned,
                items: [...selectedItems],
                status: "pending",
                time: "Baru saja"
            };

            state.validations.unshift(newValidation);
            saveAppState(state);

            // Animate overlay
            const overlay = document.getElementById('successOverlay');
            const content = document.getElementById('successContent');
            
            document.getElementById("success-message").innerText = `${pointsEarned} poin tercatat untuk ${activeStudent.name}`;

            overlay.classList.add('active');
            content.classList.remove('scale-90');
            content.classList.add('scale-100');

            setTimeout(() => {
                overlay.classList.remove('active');
                content.classList.remove('scale-100');
                content.classList.add('scale-90');
                
                // Reset toggles
                document.querySelectorAll('.item-toggle').forEach(btn => {
                    if(btn.getAttribute('aria-pressed') === 'true') {
                        toggleItem(btn, btn.id.includes('tumbler') ? 'Tumbler' : 'Lunchbox');
                    }
                });
            }, 1800);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const state = getAppState();
            const user = getLoggedInUser();
            document.getElementById("officer-avatar").src = user.avatar;

            // Load select menu options
            const select = document.getElementById("studentSelect");
            select.innerHTML = "";
            state.students.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.name} (${s.id})</option>`;
            });

            // Initial selected student
            activeStudent = state.students[0];
            changeScannedStudent();
        });
    </script>
</body>
</html>
